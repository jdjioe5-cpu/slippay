name: test

on:
  pull_request: null
  push:
    branches:
    - main

# CI Surface Matrix:
# Every surface with tests is gated on PR and push to main so signals are complete.
# 1. test (workspace): TS packages (@slippay/shared), apps (@slippay/web, @slippay/listener),
#    and Supabase Deno edge function tests against local stack.
# 2. contracts: Soroban smart contracts (checkout, receipt, smart-wallet, subscription).
#    Previously only tested in post-merge release pipelines; now gated directly on PRs.
# 3. agents: Multi-agent security suites (antiabuse, authority, axl, billing, settlement
#    via Node test runner; grammar, ifc, tee via pytest; prove-vs-judge benchmark in eval).
# 4. app: Flutter mobile client tests (money representations, state machines, etc.).
# 5. plugin: WooCommerce payment gateway WordPress plugin syntax lint (php -l).

jobs:
  test:
    name: Workspace & Edge tests (shared, web, listener, supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
      with:
        version: 9.12.0
    - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
      with:
        node-version: 22
        cache: pnpm
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      with:
        deno-version: v2.x
    - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
      with:
        version: latest
    - name: Install
      run: pnpm install --frozen-lockfile
    - name: Build shared (consumed by web + listener)
      run: pnpm --filter @slippay/shared build
    - name: Lint
      run: pnpm -r lint
    - name: Workspace tests (shared, web, listener)
      run: pnpm -r test
    - name: Start local Supabase stack
      run: supabase start
    - name: API edge function tests (deno)
      env:
        SUPABASE_URL: http://127.0.0.1:54321
        SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
        RATE_BRL_USDC: '5.80'
        API_KEY_PEPPER: 'ci-test-api-key-pepper-at-least-32-characters-long'
        CHECKOUT_TOKEN_SECRET: 'ci-test-checkout-token-secret-at-least-32-chars'
      run: |
        cd supabase/functions/api
        deno test --allow-all --no-check --env-file=../../../.env.local.ci test/ || \
          deno test --allow-all --no-check test/
    - name: Build web
      run: pnpm --filter @slippay/web build
    - name: Build listener
      run: pnpm --filter @slippay/listener build
    - name: Stop Supabase
      if: always()
      run: supabase stop || true

  contracts:
    name: Contracts tests (checkout, receipt, smart-wallet, subscription)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    - name: Test checkout contract
      run: cd contracts/checkout && cargo test --release
    - name: Test receipt contract
      run: cd contracts/receipt && cargo test --release
    - name: Test smart-wallet contract
      run: cd contracts/smart-wallet && cargo test --release
    - name: Test subscription contract
      run: cd contracts/subscription && cargo test --release

  agents:
    name: Agent suites (node --test, pytest, benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
      with:
        node-version: 22
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python test dependencies
      run: pip install pytest pytest-asyncio
    - name: Node agent tests (antiabuse, authority, axl, billing, settlement)
      run: node --test "agents/**/*.test.mjs"
    - name: Python agent tests (grammar, ifc, tee)
      run: python -m pytest agents
    - name: Prove-vs-judge benchmark (eval)
      run: node eval/prove_vs_judge_benchmark.mjs

  app:
    name: Flutter app tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Install app dependencies
      run: cd app && flutter pub get
    - name: Run Flutter tests
      run: cd app && flutter test

  plugin:
    name: WordPress plugin (PHP lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: Lint PHP files in woocommerce-slippay
      run: |
        for f in $(find plugins/woocommerce-slippay -name "*.php"); do
          php -l "$f" || exit 1
        done
